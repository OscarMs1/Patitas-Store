<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Productos | Admin Patitas Store</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="admin-layout">

  <aside class="admin-menu">

    <div class="marca">
      <img src="../img/logo.svg" alt="Patitas Store" width="30" height="30">
      <span>Panel admin</span>
    </div>

    <nav class="enlaces">
      <p class="seccion">General</p>
      <a href="index.html" class="">Inicio</a>

      <p class="seccion">Mantenedores</p>
      <a href="productos.html" class="activo">Productos</a>
      <a href="usuarios.html" class="">Usuarios</a>

      <p class="seccion">Tienda</p>
      <a href="../index.html">Volver al sitio</a>
      <a href="../login.html">Cerrar sesion</a>
    </nav>

  </aside>

  <div class="admin-contenido">

    <div class="admin-titulo">
      <div>
        <h1>Productos</h1>
        <p class="ayuda">Listado de todos los productos del catalogo</p>
      </div>
      <a class="btn btn-principal" href="producto-form.html">Nuevo producto</a>
    </div>

    <div class="caja">
      <div class="table-responsive">
        <table class="tabla-simple">
          <thead>
            <tr>
              <th>Codigo</th>
              <th>Nombre</th>
              <th>Categoria</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          
          <tbody id="cuerpoTablaProductos"></tbody>
        </table>
      </div>

      <p class="ayuda mt-3">
        Las filas en rojo tienen el stock igual o por debajo del stock critico.
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/productos.js"></script>
<script src="../js/regiones-comunas.js"></script>
<script src="../js/validaciones.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
